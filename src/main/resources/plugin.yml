name: BanditWarps
version: '${project.version}'
main: nl.bandit.warps.BanditWarpsPlugin
api-version: '26.2'
commands:
  pwarp:
    description: Open of beheer player warps
    aliases:
      - pwarps
      - spelerwarps
    usage: /pwarp
permissions:
  banditwarps.use:
    default: true
  banditwarps.create:
    default: true
  banditwarps.admin:
    default: op
  banditwarps.icon.default:
    default: true
  banditwarps.icon.home:
    default: true
  banditwarps.icon.shop:
    default: true
