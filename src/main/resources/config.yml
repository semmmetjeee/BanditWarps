visitor-cooldown-minutes: 15
date-format: 'dd-MM-yyyy HH:mm'
empty-description: 'Deze warp heeft nog geen beschrijving.'
validation:
  name-min-length: 3
  name-max-length: 20
  name-regex: '[A-Za-z0-9_-]+'
  # Korte beschrijving van één regel; toegestane waarde: 1 t/m 50.
  description-max-length: 50
limits:
  default: 5
  permission-tiers:
    - 10
    - 25
    - 50
    - 100
